<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관심종목</title>
<style>
  :root{
    --ink:#11161d; --ink-soft:#5b6675; --line:#e3e7ee; --line-soft:#eef1f6;
    --panel:#ffffff; --canvas:#f5f7fa; --accent:#1f6feb; --amber:#b06000; --amber-bg:#fdf3e3;
    --bull:#188038; --bull-bg:#eef7f0; --bear:#c5221f; --bear-bg:#fdeeed;
    --us:#1f6feb; --us-bg:#eaf1fd; --kr:#c5221f; --kr-bg:#fdeceb; --up:#c5221f; --down:#1f6feb;
    --star:#c2772a;
    --shadow:0 1px 2px rgba(16,22,30,.05);
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;line-height:1.45;padding:26px 16px 44px;font-size:13px}
  .wrap{max-width:820px;margin:0 auto}
  header{margin-bottom:16px}
  .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px}
  h1{font-size:23px;font-weight:760;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--ink-soft);font-size:12.5px;margin:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
  .add{padding:14px 15px;margin-bottom:16px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:11px}
  .seg button{font:700 12px var(--sans);border:0;background:#fff;color:var(--ink-soft);padding:7px 16px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .frm{display:grid;grid-template-columns:1fr auto;gap:8px}
  .frm input{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;width:100%;color:var(--ink)}
  .frm input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .addbtn{border:0;border-radius:8px;padding:8px 16px;font:700 12.5px var(--sans);color:#fff;background:var(--star);cursor:pointer;white-space:nowrap}
  .sec{margin-bottom:16px}
  .sec-head{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line);font-weight:720;font-size:13px}
  .sec-head .tag{font:700 9.5px var(--mono);padding:2px 7px;border-radius:5px}
  .sec.us .tag{background:var(--us-bg);color:var(--us)} .sec.kr .tag{background:var(--kr-bg);color:var(--kr)}
  .sec-head .cnt{margin-left:auto;font:600 11.5px var(--mono);color:var(--ink-soft)}
  .list{padding:4px 8px 8px}
  .empty{color:var(--ink-soft);font-size:12.5px;padding:12px 8px;text-align:center}
  .li{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .li:hover{background:var(--line-soft);border-color:var(--line)}
  .li .star{color:var(--star);font-size:13px;flex:none}
  .li .nm{font-weight:680;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li .op{font:700 9px var(--mono);padding:2px 6px;border-radius:4px;background:var(--bull-bg);color:var(--bull);flex:none}
  .li .noop{font:700 9px var(--mono);padding:2px 6px;border-radius:4px;background:var(--line-soft);color:var(--ink-soft);flex:none}
  .li .up{font:700 11.5px var(--mono);flex:none} .li .up.pf{color:var(--up)} .li .up.ls{color:var(--down)}
  .li .del{border:0;background:none;color:#c2cad4;font-size:16px;cursor:pointer;flex:none;border-radius:6px;padding:2px 5px}
  .li .del:hover{color:#d24545;background:#fbeaea}
  .li .arw{color:#c2cad4;font-size:15px;flex:none}
  .fromop{font-size:11px;color:var(--ink-soft);padding:8px 10px 2px}
  /* 팝업: 투자의견 보기 */
  .ov{position:fixed;inset:0;background:rgba(16,22,30,.44);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow:auto}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(16,22,30,.28);width:100%;max-width:560px;margin:auto;overflow:hidden}
  .m-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .m-head .nm{font-size:15px;font-weight:740}
  .m-head .tag{font:700 9.5px var(--mono);padding:2px 7px;border-radius:5px}
  .m-x{margin-left:auto;border:0;background:none;color:#9aa4b0;font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px}
  .m-x:hover{background:var(--line-soft);color:#d24545}
  .m-body{padding:15px;max-height:calc(100vh - 200px);overflow:auto}
  .prices{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .pf-i{font:600 12px var(--mono);color:var(--ink-soft)} .pf-i b{color:var(--ink);font-size:13px;margin-left:4px}
  .upside{font:700 12px var(--mono);padding:4px 9px;border-radius:8px;background:var(--line-soft)}
  .upside.pf{color:var(--up)} .upside.ls{color:var(--down)}
  .stance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  @media(max-width:560px){.stance{grid-template-columns:1fr}}
  .st{border-radius:8px;padding:9px 11px;font-size:12.5px;white-space:pre-wrap;line-height:1.5;min-height:44px}
  .st .l{display:block;font:700 10px var(--mono);margin-bottom:5px}
  .st.bull{background:var(--bull-bg)} .st.bull .l{color:var(--bull)}
  .st.bear{background:var(--bear-bg)} .st.bear .l{color:var(--bear)}
  .note{background:#fcfcfd;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;white-space:pre-wrap;line-height:1.5;margin-bottom:12px}
  .note .l{display:block;font:700 10px var(--mono);color:var(--ink-soft);margin-bottom:5px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  .noop-msg{color:var(--ink-soft);font-size:12.5px;padding:6px 0 4px}
  .m-foot{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}
  .m-foot a{border:1px solid var(--line);background:#fff;color:var(--accent);font:700 12px var(--sans);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
  .m-foot a:hover{border-color:var(--accent)}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .lb.on{display:flex} .lb img{max-width:100%;max-height:100%;border-radius:8px}
  footer{max-width:820px;margin:6px auto 0;color:var(--ink-soft);font-size:11px;text-align:center}
  @media(max-width:640px){ body{padding:16px 10px 44px} input,select,textarea{font-size:16px !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Watchlist</div>
    <h1>관심종목</h1>
    <p class="sub">국장·미장 관심종목을 저장하고, 종목을 누르면 그 종목의 <b>투자의견</b>을 팝업으로 봐요. 투자의견에 추가한 종목은 자동으로 여기에도 나타납니다.</p>
  </header>

  <section class="panel add">
    <div class="seg" role="group" aria-label="시장">
      <button id="mUs" aria-pressed="true">미장</button>
      <button id="mKr" aria-pressed="false">국장</button>
    </div>
    <div class="frm">
      <input id="fName" list="stocklist" placeholder="종목 추가 (포트폴리오·투자의견에서 자동완성)">
      <datalist id="stocklist"></datalist>
      <button class="addbtn" id="addBtn">★ 추가</button>
    </div>
  </section>

  <section class="panel sec us">
    <div class="sec-head"><span class="tag">US</span>미장<span class="cnt" id="cntUs">0</span></div>
    <div class="list" id="listUs"></div>
  </section>
  <section class="panel sec kr">
    <div class="sec-head"><span class="tag">KR</span>국장<span class="cnt" id="cntKr">0</span></div>
    <div class="list" id="listKr"></div>
  </section>
</div>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <div class="m-head" id="mHead"></div>
  <div class="m-body" id="mBody"></div>
  <div class="m-foot"><a href="opinion.html" id="goOp">투자의견에서 편집 →</a></div>
</div></div>
<div class="lb" id="lb"><img id="lbImg" alt="첨부 사진"></div>

<footer>관심종목은 이 브라우저에 저장 · 투자의견 종목은 자동 반영(읽기 전용 보기) · 정보 정리용 도구</footer>

<script>
(function(){
  "use strict";
  const WKEY="toolkit:watchlist", OKEY="toolkit:opinion";
  const id=x=>document.getElementById(x);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const won=n=>"₩"+Math.round(Number(n)||0).toLocaleString("ko-KR");
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const norm=s=>String(s||"").trim();

  let watch=[];
  try{const s=localStorage.getItem(WKEY);if(s){const a=JSON.parse(s);if(Array.isArray(a))watch=a;}}catch(e){}
  function persist(){try{localStorage.setItem(WKEY,JSON.stringify(watch));}catch(e){}}

  function readOpinions(){try{const s=localStorage.getItem(OKEY);if(!s)return [];
    const o=JSON.parse(s);const arr=Array.isArray(o)?o:(o&&o.data)||[];return Array.isArray(arr)?arr:[];}catch(e){return [];}}
  function pieNames(){const out=[];["toolkit:pie1","toolkit:pie-us"].forEach(k=>{try{const s=localStorage.getItem(k);if(!s)return;
    const o=JSON.parse(s);const arr=Array.isArray(o)?o:(o&&o.data)||[];arr.forEach(x=>{if(x&&x.name)out.push(x.name);});}catch(e){}});return out;}

  // 투자의견 종목을 관심종목에 자동 병합(파일 수정 없이 파생)
  function syncFromOpinion(){
    const ops=readOpinions();let changed=false;
    ops.forEach(o=>{const nm=norm(o.name);const mk=o.market==="kr"?"kr":"us";if(!nm)return;
      if(!watch.some(w=>norm(w.name)===nm && w.market===mk)){
        watch.push({id:uid(),market:mk,name:nm,fromOpinion:true});changed=true;}});
    if(changed)persist();
  }

  function opinionFor(name,market){const nm=norm(name);
    return readOpinions().find(o=>norm(o.name)===nm && (o.market==="kr"?"kr":"us")===market)||null;}
  function upside(o){if(o&&o.cur>0&&o.target>0)return (o.target/o.cur-1)*100;return null;}

  let addMarket="us";
  const fName=id("fName");
  function setMarket(m){addMarket=m;id("mUs").setAttribute("aria-pressed",m==="us");id("mKr").setAttribute("aria-pressed",m==="kr");}
  id("mUs").addEventListener("click",()=>setMarket("us"));
  id("mKr").addEventListener("click",()=>setMarket("kr"));
  function buildDatalist(){const names=[...new Set([...pieNames(),...readOpinions().map(o=>o.name),...watch.map(w=>w.name)])].filter(Boolean);
    id("stocklist").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");}

  function add(){const nm=norm(fName.value);if(!nm){fName.focus();return;}
    if(watch.some(w=>norm(w.name)===nm && w.market===addMarket)){fName.value="";render();return;}
    watch.push({id:uid(),market:addMarket,name:nm,fromOpinion:false});persist();fName.value="";render();}
  id("addBtn").addEventListener("click",add);
  fName.addEventListener("keydown",e=>{if(e.key==="Enter")add();});

  function liHtml(w){
    const o=opinionFor(w.name,w.market),u=upside(o);
    const opChip=o?'<span class="op">투자의견</span>':'<span class="noop">의견 없음</span>';
    const up=(u!=null)?`<span class="up ${u>=0?'pf':'ls'}">${u>=0?'+':''}${u.toFixed(1)}%</span>`:"";
    return `<div class="li" data-open="${w.id}"><span class="star">★</span>`+
      `<span class="nm">${esc(w.name)}</span>${opChip}${up}`+
      `<button class="del" data-del="${w.id}" title="관심종목에서 제거">×</button>`+
      `<span class="arw" data-open="${w.id}">›</span></div>`;}
  function render(){
    buildDatalist();
    const us=watch.filter(w=>w.market==="us"), kr=watch.filter(w=>w.market==="kr");
    const sort=a=>a.slice().sort((x,y)=>norm(x.name)<norm(y.name)?-1:1);
    id("listUs").innerHTML=us.length?sort(us).map(liHtml).join(""):'<div class="empty">아직 미장 관심종목이 없어요</div>';
    id("listKr").innerHTML=kr.length?sort(kr).map(liHtml).join(""):'<div class="empty">아직 국장 관심종목이 없어요</div>';
    id("cntUs").textContent=us.length;id("cntKr").textContent=kr.length;
  }

  // ---- 팝업: 투자의견 보기 ----
  const ov=id("ov");
  function openW(idv){const w=watch.find(x=>x.id===idv);if(!w)return;
    const o=opinionFor(w.name,w.market),u=upside(o);
    id("mHead").innerHTML=`<span class="tag" style="background:${w.market==='us'?'var(--us-bg)':'var(--kr-bg)'};color:${w.market==='us'?'var(--us)':'var(--kr)'}">${w.market==='us'?'US':'KR'}</span>`+
      `<span class="nm">${esc(w.name)}</span><button class="m-x" id="mX" aria-label="닫기">×</button>`;
    let body;
    if(!o){
      body=`<div class="noop-msg">이 종목은 아직 <b>투자의견</b>이 없어요.<br>투자의견 도구에서 목표가·긍정·부정을 작성하면 여기서 바로 볼 수 있어요.</div>`;
    }else{
      const up=(u!=null)?`<span class="upside ${u>=0?'pf':'ls'}">상승여력 ${u>=0?'+':''}${u.toFixed(1)}%</span>`:`<span class="upside">상승여력 —</span>`;
      body=`<div class="prices">`+
        (o.cur>0?`<span class="pf-i">현재가<b>${won(o.cur)}</b></span>`:"")+
        (o.target>0?`<span class="pf-i">목표가<b>${won(o.target)}</b></span>`:"")+up+
        (o.date?`<span class="pf-i" style="margin-left:auto">작성 ${esc(o.date)}</span>`:"")+`</div>`+
        `<div class="stance">`+
          `<div class="st bull"><span class="l">＋ 긍정</span>${o.bull?esc(o.bull):'<span style="color:var(--ink-soft)">—</span>'}</div>`+
          `<div class="st bear"><span class="l">－ 부정</span>${o.bear?esc(o.bear):'<span style="color:var(--ink-soft)">—</span>'}</div>`+
        `</div>`+
        (o.note?`<div class="note"><span class="l">비고</span>${esc(o.note)}</div>`:"")+
        ((o.photos&&o.photos.length)?`<div class="thumbs">${o.photos.map((p,i)=>`<img src="${p}" data-zoom="${i}" alt="첨부">`).join("")}</div>`:"");
    }
    id("mBody").innerHTML=body;
    id("mX").addEventListener("click",closeW);
    if(o&&o.photos)id("mBody").querySelectorAll("[data-zoom]").forEach(im=>im.addEventListener("click",()=>{id("lbImg").src=o.photos[+im.dataset.zoom];id("lb").classList.add("on");}));
    ov.classList.add("on");document.body.style.overflow="hidden";}
  function closeW(){ov.classList.remove("on");document.body.style.overflow="";}
  ov.addEventListener("click",e=>{if(e.target===ov)closeW();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(id("lb").classList.contains("on"))id("lb").classList.remove("on");else if(ov.classList.contains("on"))closeW();}});
  id("lb").addEventListener("click",()=>id("lb").classList.remove("on"));

  document.body.addEventListener("click",e=>{
    const del=e.target.closest("[data-del]");
    if(del){e.stopPropagation();watch=watch.filter(w=>w.id!==del.dataset.del);persist();render();return;}
    const op=e.target.closest("[data-open]");if(op)openW(op.dataset.open);});

  syncFromOpinion();
  render();
})();
</script>
</body>
</html>
